name: gamestudio
services:
  app:
    build:
      context: .
      target: app
    image: gamestudio-app:production
    init: true
    user: "1000:1000"
    env_file:
      - ${GAMESTUDIO_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      GAMESTUDIO_MODE: production
      GAMESTUDIO_HOST: 0.0.0.0
      GAMESTUDIO_PROXY_HOPS: "1"
      GAMESTUDIO_DATA_DIR: /var/lib/gamestudio
      PORT: "4100"
    expose:
      - "4100"
    volumes:
      - studio_data:/var/lib/gamestudio
      - codex_auth:/home/node/.codex
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 35s
    networks: [studio]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const url=new URL(process.env.GAMESTUDIO_PUBLIC_URL);
          const req=require('node:http').get({hostname:'127.0.0.1',port:4100,path:'/api/health',headers:{Host:url.host,'X-Forwarded-Proto':'https'}},res=>{res.resume();if(res.statusCode!==200)process.exitCode=1;});
          req.setTimeout(4000,()=>{req.destroy();process.exitCode=1;});
          req.on('error',()=>{process.exitCode=1;});
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    build:
      context: .
      target: proxy
    image: gamestudio-proxy:production
    user: "1000:1000"
    environment:
      GAMESTUDIO_DOMAIN: ${GAMESTUDIO_DOMAIN:?Set GAMESTUDIO_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    depends_on:
      app: {condition: service_healthy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
    networks: [studio]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
# The bridge is not externally published, while provider HTTPS egress remains
# available. An internal:true-only network would break OAuth, SMS and payments.
networks:
  studio: {driver: bridge}
volumes:
  studio_data:
  codex_auth:
  caddy_data:
  caddy_config:
